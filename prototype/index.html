<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheikah Slate · AI Passport 原型</title>
<link rel="stylesheet" href="css/slate.css">
<link rel="stylesheet" href="css/referenced-art.css">
<link rel="icon" href="../assets/gen/prototype/eye.png">
</head>
<body>
  <div class="stage">
    <aside class="rail">
      <div class="rail-head">
        <img src="../assets/gen/prototype/eye.png" alt="">
        <div>
          <strong>SHEIKAH SLATE</strong>
          <span>AI PASSPORT</span>
        </div>
      </div>
      <nav id="railNav" class="rail-nav"></nav>
      <div class="rail-foot">
        <p>↑ ↓ 选择 · Enter 确认<br>长按 Enter / Esc 返回</p>
        <button id="languageBtn" class="rail-reset rail-language">语言 · 简体中文</button>
        <button id="resetBtn" class="rail-reset">重置原型状态</button>
      </div>
    </aside>

    <main class="device-wrap">
      <div class="device" id="device">
        <div class="device-top">
          <span>AI PASSPORT</span>
          <i class="led"></i>
        </div>
        <div class="screen-shell" id="screenShell">
          <div class="screen" id="screen"></div>
          <div class="scanlines" id="scanlines"></div>
          <div class="glass"></div>
        </div>
        <div class="keys">
          <button class="key" data-key="UP" aria-label="UP">▲</button>
          <button class="key ok" data-key="OK" aria-label="OK">OK<span class="hold"></span></button>
          <button class="key" data-key="DOWN" aria-label="DOWN">▼</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/quest-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/compendium-data.js"></script>
  <script src="js/inventory-data.js"></script>
  <script src="js/rune-art.js"></script>
  <script src="js/rune-games.js"></script>
  <script src="js/rune-extras.js"></script>
  <script src="js/abilities.js"></script>
  <script src="js/map-data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
