name: deploy-pages
# 组装原型静态站并部署到 GitHub Pages。
# 启用前提（仓库设置 → Pages → Source: GitHub Actions）+ 仓库可见性/素材公开决策确认。
# 策略：含原作音效（用户决策 2026-11-01）；如需静音演示，去掉 --with-audio。
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools
      - run: python -B tools/pages/build_site.py -o dist --with-audio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
